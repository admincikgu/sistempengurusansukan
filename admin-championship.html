<meta name="viewport" content="width=device-width,initial-scale=1"><title>House Championship | SMKDHAB</title><link rel="stylesheet" href="/style.css"></head><body><button id="pwaInstallButton" class="pwa-install-button" type="button" hidden>＋ Install App</button><div class="admin-main"><div class="admin-mobile-top"><button id="mobileMenuButton" class="mobile-menu-button" type="button">☰</button><strong style="color:var(--navy);font-size:11px">Admin</strong><a class="nav-link" href="/">Home</a></div><div id="mobileOverlay" class="mobile-overlay"></div><aside id="adminSidebar" class="admin-sidebar"><div class="admin-sidebar-brand"><img class="sidebar-school-logo" src="/assets/smkdhbadawi-logo.jpg"><div><strong>SMKDHAB</strong><span>Sports Administration</span></div></div><div class="admin-sidebar-label">MAIN</div><nav class="admin-sidebar-nav"><a class="admin-sidebar-link " href="/admin-dashboard.html"><span class="ico">⌂</span>Dashboard</a><a class="admin-sidebar-link " href="/admin-command-center.html"><span class="ico">🎛️</span>Command Center</a><a class="admin-sidebar-link " href="/admin-participants.html"><span class="ico">👥</span>Participants</a><a class="admin-sidebar-link " href="/admin-athlete.html"><span class="ico">👤</span>Athlete Profile</a><a class="admin-sidebar-link active" href="/admin-houses.html"><span class="ico">🏠</span>Sports Houses</a><a class="admin-sidebar-link " href="/admin-events.html"><span class="ico">🏃</span>Sports Events</a><a class="admin-sidebar-link " href="/admin-results.html"><span class="ico">🏆</span>Results</a><a class="admin-sidebar-link " href="/admin-reports.html"><span class="ico">📄</span>Reports</a><a class="admin-sidebar-link " href="/admin-import.html"><span class="ico">⇩</span>Import Students</a></nav><div class="admin-sidebar-footer"><a class="admin-sidebar-link home-link" href="/"><span class="ico">⌂</span>Main Dashboard</a><button class="admin-sidebar-link" id="sidebarLogout" type="button"><span class="ico">↪</span>Log Out</button></div></aside><main class="admin-page-main"><header class="admin-page-header"><div><a class="page-nav-back" href="/admin-houses.html">← Sports Houses</a><h1>House Championship</h1><p>Overall standings based on official competition points.</p></div></header><section class="surface panel"><div id="list" class="house-champ-list"><div class="empty">Loading...</div></div></section></main></div><script>
const TOKEN=sessionStorage.getItem("smkAdminToken");if(!TOKEN)location.href="/admin.html";
async function api(u,o={}){const r=await fetch(u,{...o,cache:"no-store"}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error("Invalid server response")}if(!r.ok)throw new Error(d.message||d.error||"Request failed");return d}
async function load(){const a={"x-admin-pin":TOKEN},r=await api("/api/admin?action=results",{headers:a}),rows=r;const map={};for(const x of rows){const h=x.house||"UNASSIGNED";map[h]=(map[h]||0)+Number(x.points||0)}const all=[...new Set(["BAHAMAN","MAT KILAU","DATO' SAGOR","DATO' MAHARAJALELA",...Object.keys(map)])].map(h=>({h,p:map[h]||0})).sort((a,b)=>b.p-a.p);const max=Math.max(1,...all.map(x=>x.p));document.getElementById("list").innerHTML=all.map((x,i)=>`<div class="house-champ-row"><div class="house-rank-badge">${i+1}</div><div><div class="house-champ-name">${x.h}</div><div class="house-champ-bar"><span style="width:${Math.max(3,x.p/max*100)}%"></span></div></div><div class="house-points-value">${x.p} pts</div></div>`).join("")}load().catch(e=>document.getElementById("list").innerHTML=`<div class="message error">✕ ${e.message}</div>`);
</script>
<script>
(function(){
  let deferredPrompt=null;
  const installButton=document.getElementById("pwaInstallButton");
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("/sw.js").catch(function(err){
        console.warn("PWA service worker registration failed:",err);
      });
    });
  }
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    deferredPrompt=event;
    if(installButton){installButton.hidden=false}
  });
  if(installButton){
    installButton.addEventListener("click",async function(){
      if(!deferredPrompt)return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
      installButton.hidden=true;
    });
  }
  window.addEventListener("appinstalled",function(){
    if(installButton)installButton.hidden=true;
  });
})();
</script>
