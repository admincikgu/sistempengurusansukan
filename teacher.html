<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher View</title><link rel="stylesheet" href="/style.css"></head><body><header><a href="/">🏃 SukanSekolah</a><span>👩‍🏫 Teacher View　<a href="/admin.html">Admin View →</a></span></header><main><small>ANTARAMUKA GURU</small><h1>Pendaftaran Peserta</h1><section class="card"><h2>➕ Daftar Peserta</h2><form id="f"><div class="grid"><label>Nama Guru<input id="teacher" required></label><label>Nama Pelajar<input id="studentName" required></label><label>ID Pelajar<input id="studentId" required></label><label>Acara<select id="event"></select></label><label>Kategori<select id="category"></select></label><label>Rumah Sukan<select id="house"></select></label></div><button>Daftar Peserta</button><span id="msg"></span></form></section><section class="card"><h2>Rekod Pendaftaran Saya</h2><input id="search" placeholder="🔎 Cari..."><div class="table"><table><thead><tr><th>Pelajar</th><th>ID</th><th>Acara</th><th>Kategori</th><th>Rumah</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const $=x=>document.getElementById(x);let data=[];async function init(){let m=await fetch('/api/master').then(r=>r.json());[['event',m.events],['category',m.categories],['house',m.houses]].forEach(([i,a])=>$(i).innerHTML=a.map(x=>`<option>${x}</option>`).join(''));load()}async function load(){let t=$('teacher').value.trim();if(!t)return $('rows').innerHTML='<tr><td colspan=6>Masukkan nama guru.</td></tr>';data=await fetch('/api/teacher/registrations?teacher='+encodeURIComponent(t)).then(r=>r.json());render()}function render(){let q=$('search').value.toLowerCase();$('rows').innerHTML=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<tr><td>${x.studentName}</td><td>${x.studentId}</td><td>${x.event}</td><td>${x.category}</td><td>${x.house}</td><td><button class=del onclick="del('${x._id}')">Padam</button></td></tr>`).join('')||'<tr><td colspan=6>Tiada rekod.</td></tr>'}$('teacher').onchange=load;$('search').oninput=render;$('f').onsubmit=async e=>{e.preventDefault();let b={teacher:$('teacher').value,studentName:$('studentName').value,studentId:$('studentId').value,event:$('event').value,category:$('category').value,house:$('house').value};let r=await fetch('/api/teacher/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();$('msg').textContent=d.message||'✓ Berjaya';if(r.ok){$('studentName').value='';$('studentId').value='';load()}};async function del(id){if(confirm('Padam?')){await fetch('/api/teacher/registrations/'+id,{method:'DELETE'});load()}}init();</script></body></html>
