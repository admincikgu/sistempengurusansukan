<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher View</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/">← Utama</a><b>Teacher View</b><a href="/admin.html">Admin</a></nav><main><section class="hero"><small>ANTARAMUKA GURU</small><h1>Pendaftaran Peserta</h1><span id="db">Checking database...</span></section><form id="f" class="panel"><div class="grid"><input id="teacher" placeholder="Nama Guru" required><input id="studentName" placeholder="Nama Pelajar" required><input id="studentId" placeholder="ID / No KP" required><select id="event" required></select><select id="category" required></select><select id="house" required></select></div><button>Daftar Peserta</button><p id="m"></p></form><section class="panel"><h2>Rekod</h2><table><thead><tr><th>Pelajar</th><th>ID</th><th>Acara</th><th>Kategori</th><th>Rumah</th><th>Guru</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
const $=i=>document.getElementById(i);async function api(p,o={}){const r=await fetch("/api"+p,{cache:"no-store",...o}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error("HTTP "+r.status+" - server bukan JSON")};if(!r.ok)throw Error(d.message||d.error);return d}
async function init(){try{const m=await api("/master");for(const [id,a] of [["event",m.events],["category",m.categories],["house",m.houses]])$(id).innerHTML='<option value="">Pilih...</option>'+a.map(x=>`<option>${x}</option>`).join("");const s=await api("/admin/status");$("db").textContent="● Live Database: Connected · "+s.total+" pendaftaran"}catch(e){$("db").textContent="● Database: "+e.message};load()}
async function load(){try{const d=await api("/teacher/registrations?teacher="+encodeURIComponent($("teacher").value));$("rows").innerHTML=d.map(x=>`<tr><td>${x.studentName}</td><td>${x.studentId}</td><td>${x.event}</td><td>${x.category}</td><td>${x.house}</td><td>${x.teacher}</td></tr>`).join("")||'<tr><td colspan="6">Tiada rekod</td></tr>'}catch(e){$("rows").innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}}
$("f").onsubmit=async e=>{e.preventDefault();$("m").textContent="Menyimpan...";try{const d=await api("/teacher/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({teacher:$("teacher").value,studentName:$("studentName").value,studentId:$("studentId").value,event:$("event").value,category:$("category").value,house:$("house").value})});$("m").textContent="✓ "+d.message;$("studentName").value="";$("studentId").value="";await load();await init()}catch(e){$("m").textContent="✕ "+e.message}};init();
</script></body></html>
