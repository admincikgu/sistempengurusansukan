<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher View</title><link rel="stylesheet" href="/style.css"></head><body><nav><a href="/">← Utama</a><b>Teacher View</b><a href="/admin.html">Admin</a></nav><main><section class="hero"><small>ANTARAMUKA GURU</small><h1>Pendaftaran Peserta</h1><span id="db">Checking...</span></section><form id="f" class="panel"><div class="grid"><input id="teacher" placeholder="Nama Guru" required><input id="studentName" placeholder="Nama Pelajar" required><input id="studentId" placeholder="ID / No KP" required><select id="event" required></select><select id="category" required></select><select id="house" required></select></div><button>Daftar Peserta</button><p id="m"></p></form><section class="panel"><h2>Rekod Pendaftaran</h2><table><thead><tr><th>Pelajar</th><th>ID</th><th>Acara</th><th>Kategori</th><th>Rumah</th><th>Guru</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
const $=i=>document.getElementById(i);
async function api(u,o={}){const r=await fetch(u,{cache:"no-store",...o});const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error("HTTP "+r.status+" - server bukan JSON")};if(!r.ok)throw Error(d.message||d.error);return d}
function fill(id,a){$(id).innerHTML='<option value="">Pilih...</option>'+a.map(x=>'<option>'+x+'</option>').join("")}
async function init(){try{const m=await api("/api/master");fill("event",m.events);fill("category",m.categories);fill("house",m.houses);const s=await api("/api/admin-status");$("db").textContent="● Live Database: Connected · "+s.total+" pendaftaran"}catch(e){$("db").textContent="● Database: "+e.message}loadRows()}
async function loadRows(){try{const t=$("teacher").value.trim();const d=await api("/api/teacher-registrations?teacher="+encodeURIComponent(t));$("rows").innerHTML=d.map(x=>'<tr><td>'+x.studentName+'</td><td>'+x.studentId+'</td><td>'+x.event+'</td><td>'+x.category+'</td><td>'+x.house+'</td><td>'+x.teacher+'</td></tr>').join("")||'<tr><td colspan="6">Tiada rekod</td></tr>'}catch(e){$("rows").innerHTML='<tr><td colspan="6">'+e.message+'</td></tr>'}}
$("f").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/teacher-register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({teacher:$("teacher").value,studentName:$("studentName").value,studentId:$("studentId").value,event:$("event").value,category:$("category").value,house:$("house").value})});$("m").textContent="✓ "+d.message;$("studentName").value="";$("studentId").value="";loadRows();init()}catch(e){$("m").textContent="✕ "+e.message}};init();
</script><footer style="text-align:center;padding:18px;color:#8b92a0;font-size:11px">SMK Datuk Haji Ahmad Badawi · Sistem Pengurusan Sukan Sekolah · 2026</footer></body></html>
