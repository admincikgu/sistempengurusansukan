<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin View</title><link rel="stylesheet" href="/style.css">
<style>
.admin-access-shell{width:min(560px,94vw);padding:24px}
.access-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back-link{color:rgba(255,255,255,.78);text-decoration:none;font-size:13px}
.secure-badge{font-size:10px;letter-spacing:1.3px;font-weight:800;color:#e9e3ff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);padding:8px 11px;border-radius:999px}
.admin-access-card{background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.7);border-radius:30px;padding:38px 38px 28px;text-align:center;box-shadow:0 30px 90px rgba(7,13,34,.32)}
.school-emblem{width:68px;height:68px;margin:0 auto 15px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#6650d3,#9278ec);color:#fff;font-size:28px;box-shadow:0 14px 30px rgba(102,80,211,.25)}
.access-kicker{font-size:10px;letter-spacing:1.7px;color:#7b6cc0;font-weight:900}
.admin-access-card h1{margin:8px 0 2px;color:#182144;font-size:32px}
.access-subtitle{margin:0;color:#8b91a0;font-size:13px}
.access-divider{height:1px;background:#eeeaf5;margin:25px 0}
.lock-symbol{width:52px;height:52px;margin:auto;border-radius:16px;background:#f0ecff;color:#735bdd;display:grid;place-items:center;font-size:26px}
.admin-access-card h2{margin:13px 0 6px;color:#253052;font-size:20px}
.access-note{max-width:390px;margin:0 auto 24px;color:#858c9c;font-size:13px;line-height:1.6}
.password-label{display:block;text-align:left;color:#667085;font-size:10px;font-weight:900;letter-spacing:1.2px}
.password-wrap{position:relative}
.password-wrap input{padding-right:50px;font-size:15px;height:50px;border-radius:14px}
.show-password{position:absolute;right:7px;top:7px;width:36px;height:36px;padding:0;background:#f5f2ff;color:#735bdd;border-radius:10px}
.access-button{width:100%;height:50px;margin-top:14px;border-radius:14px;font-size:14px}
.access-button span{float:right;font-size:18px}
.access-error{min-height:20px;margin-top:10px;color:#c56f78;font-size:12px;font-weight:700}
.access-footer{border-top:1px solid #eeeaf5;margin-top:18px;padding-top:16px;color:#9aa0ac;font-size:11px}
</style>
</head><body><div id="lock" class="lock"><div class="pin"><div>🔐</div><small>ADMIN ACCESS</small><h1>Masukkan PIN</h1><input id="pin" type="password" maxlength="6" placeholder="••••••"><button onclick="unlock()">Unlock Dashboard</button><p id="err"></p><a href="/">← Kembali</a></div></div><div id="app" class="hidden"><header><a href="/">🏃 SukanSekolah</a><span>🛡️ Admin View　<a href="/teacher.html">Teacher View →</a></span></header><main><small>ANTARAMUKA ADMIN</small><h1>Dashboard Sukan</h1><div class="stats"><div><small>Total Peserta</small><b id="total">0</b></div><div><small>Acara Berdaftar</small><b id="events">0</b></div><div><small>Rumah Sukan</small><b>4</b></div></div><section class="card"><h2>📋 Master Data</h2><input id="q" placeholder="🔎 Cari nama, ID, acara..."><div class="table"><table><thead><tr><th>Pelajar</th><th>ID</th><th>Acara</th><th>Kategori</th><th>Rumah</th><th>Guru</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="split"><div class="card"><h2>🏆 Keputusan</h2><select id="participant"></select><div class="grid two"><label>Kedudukan<input id="position" type="number"></label><label>Mata<input id="points" type="number"></label><label>Masa<input id="timing"></label><label>Skor<input id="score" type="number"></label></div><button onclick="save()">Simpan Keputusan</button><span id="rm"></span></div><div class="card"><h2>🥇 Peserta Terbaik</h2><ol id="leaders"></ol></div></section><button onclick="print()">🖨 Cetak</button></main></div><script>let regs=[];async function unlock(){let r=await fetch('/api/admin/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})});if(!r.ok)return err.textContent='PIN salah.';lock.classList.add('hidden');app.classList.remove('hidden');load()}async function load(){let [o,r,l]=await Promise.all([api('/api/admin-overview').then(x=>x.json()),api('/api/admin-registrations').then(x=>x.json()),api('/api/admin-leaderboard').then(x=>x.json())]);regs=r;total.textContent=o.total;events.textContent=o.eventsOngoing;render();participant.innerHTML=regs.map(x=>`<option value="${x._id}">${x.studentName} — ${x.event}</option>`).join('');leaders.innerHTML=l.map(x=>`<li><b>${x.studentName}</b> — ${x.house} · ${x.points} mata</li>`).join('')||'<li>Belum ada keputusan.</li>'}function render(){let z=q.value.toLowerCase();rows.innerHTML=regs.filter(x=>JSON.stringify(x).toLowerCase().includes(z)).map(x=>`<tr><td>${x.studentName}</td><td>${x.studentId}</td><td>${x.event}</td><td>${x.category}</td><td>${x.house}</td><td>${x.teacher||'-'}</td></tr>`).join('')}q.oninput=render;async function save(){let r=await api('/api/admin-results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registrationId:participant.value,position:+position.value,points:+points.value||0,timing:timing.value,score:+score.value||0})});rm.textContent=r.ok?'✓ Disimpan':'Gagal';if(r.ok)load()}document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
