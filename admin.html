<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f334a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SMKDHAB Sports">
<link rel="apple-touch-icon" href="/assets/pwa-icon-192.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Access | SMK Datuk Haji Ahmad Badawi</title>
<link rel="stylesheet" href="/style.css">
<style id="admin-login-animation">
/* Premium animated admin login — visual only */
body:has(#login){
  overflow:hidden;
  background:#eef3f7!important;
}
body:has(#login) .motion-field{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  overflow:hidden!important;
  z-index:0!important;
  pointer-events:none!important;
  background:
    radial-gradient(circle at 76% 24%,rgba(211,163,52,.18),transparent 18%),
    radial-gradient(circle at 88% 76%,rgba(29,93,143,.20),transparent 24%),
    linear-gradient(135deg,#f8fbfd 0%,#e8f0f5 52%,#dce8ef 100%)!important;
}
body:has(#login) .motion-field::before{
  content:"";
  position:absolute;
  width:62vw;height:62vw;
  max-width:760px;max-height:760px;
  right:-13vw;top:50%;
  transform:translateY(-50%);
  border-radius:50%;
  border:1px solid rgba(16,47,82,.10);
  box-shadow:
    0 0 0 46px rgba(16,47,82,.025),
    0 0 0 92px rgba(16,47,82,.018),
    0 0 0 138px rgba(16,47,82,.012);
  animation:loginOrbit 18s linear infinite;
}
body:has(#login) .motion-field::after{
  content:"";
  position:absolute;
  right:-5vw;bottom:-4vh;
  width:70vw;height:34vh;
  min-height:240px;
  background:
    repeating-linear-gradient(90deg,transparent 0 74px,rgba(255,255,255,.45) 75px 76px),
    repeating-linear-gradient(0deg,transparent 0 42px,rgba(16,47,82,.045) 43px 44px);
  transform:perspective(420px) rotateX(60deg) rotateZ(-10deg);
  transform-origin:center bottom;
  opacity:.72;
  animation:trackMove 10s linear infinite;
}
body:has(#login) .motion-field .lane{
  position:absolute!important;
  width:8px!important;height:8px!important;
  border-radius:50%!important;
  background:#d3a334!important;
  box-shadow:0 0 0 8px rgba(211,163,52,.09),0 0 25px rgba(211,163,52,.18)!important;
  animation:floatSport 6s ease-in-out infinite!important;
}
body:has(#login) .motion-field .lane:nth-child(1){right:24%;top:22%;animation-delay:-1s!important}
body:has(#login) .motion-field .lane:nth-child(2){right:37%;top:63%;animation-delay:-3.2s!important;background:#1d5d8f!important;box-shadow:0 0 0 8px rgba(29,93,143,.08),0 0 25px rgba(29,93,143,.16)!important}
body:has(#login) .motion-field .lane:nth-child(3){right:12%;top:45%;animation-delay:-4.6s!important}

@keyframes loginOrbit{
  from{transform:translateY(-50%) rotate(0deg)}
  to{transform:translateY(-50%) rotate(360deg)}
}
@keyframes trackMove{
  from{background-position:0 0,0 0}
  to{background-position:120px 0,0 44px}
}
@keyframes floatSport{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(0,-18px,0) scale(1.18)}
}

body:has(#login) .login{
  position:relative!important;
  z-index:2!important;
  min-height:100vh!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  padding:28px!important;
  background:transparent!important;
}
body:has(#login) .login-card{
  width:min(430px,100%)!important;
  padding:34px!important;
  border:1px solid rgba(255,255,255,.72)!important;
  border-radius:26px!important;
  background:rgba(255,255,255,.84)!important;
  box-shadow:
    0 30px 80px rgba(16,47,82,.18),
    0 8px 24px rgba(16,47,82,.08)!important;
  backdrop-filter:blur(22px) saturate(120%)!important;
  animation:cardEnter .8s cubic-bezier(.2,.8,.2,1) both!important;
}
body:has(#login) .login-logo{
  width:84px!important;
  height:84px!important;
  object-fit:contain!important;
  border-radius:20px!important;
  border:4px solid #fff!important;
  box-shadow:0 14px 32px rgba(16,47,82,.14),0 0 0 1px rgba(16,47,82,.07)!important;
  animation:logoFloat 4.2s ease-in-out infinite!important;
}
body:has(#login) .login-card h1{
  margin-top:15px!important;
  margin-bottom:5px!important;
  font-size:clamp(2rem,5vw,2.55rem)!important;
  letter-spacing:-.04em!important;
  color:#102f52!important;
}
body:has(#login) .login-card>p{
  color:#718095!important;
}
body:has(#login) .login-card .eyebrow{
  margin-top:18px!important;
}
body:has(#login) .login-card .field{
  margin-top:22px!important;
}
body:has(#login) .login-card .login-button{
  width:100%!important;
  margin-top:14px!important;
  min-height:50px!important;
  border-radius:14px!important;
  font-size:14px!important;
  font-weight:800!important;
}
body:has(#login) .login-card .button-secondary{
  border-radius:13px!important;
}
@keyframes cardEnter{
  from{opacity:0;transform:translateY(24px) scale(.975)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
@media(max-width:760px){
  body:has(#login) .motion-field::before{right:-48vw}
  body:has(#login) .motion-field::after{right:-22vw;width:120vw}
  body:has(#login) .login-card{padding:27px!important;border-radius:22px!important}
}
@media(prefers-reduced-motion:reduce){
  body:has(#login) .motion-field::before,
  body:has(#login) .motion-field::after,
  body:has(#login) .motion-field .lane,
  body:has(#login) .login-card,
  body:has(#login) .login-logo{
    animation:none!important;
  }
}
</style>

</head>
<body data-motion-page="admin"><button id="pwaInstallButton" class="pwa-install-button" type="button" hidden>＋ Install App</button><div class="motion-field" aria-hidden="true"><span class="lane"></span><span class="lane"></span><span class="lane"></span></div>
<section id="login" class="login">
<div class="login-card">
<a class="button-secondary" href="/" style="width:100%;margin-bottom:14px">← Back to Main Dashboard</a>
<img class="login-logo" src="/assets/smkdhbadawi-logo.jpg" alt="SMK Datuk Haji Ahmad Badawi crest">
<span class="eyebrow">SMKDHAB ADMINISTRATION</span>
<h1>Admin Access</h1><p>Manage school sports, participants and results in one secure place.</p>
<div class="field"><label>ADMINISTRATOR PIN</label><input id="pin" type="password" placeholder="Enter PIN" autocomplete="current-password"></div>
<button class="button-primary login-button" id="loginBtn" type="button">Enter Dashboard</button>
<div id="loginError" class="login-error"></div>
<div style="margin-top:9px;font-size:8px;color:var(--muted)">Press Enter to continue.</div>
</div>
</section>
<script>
async function login(){
 const pin=document.getElementById("pin").value.trim();
 if(!pin){document.getElementById("loginError").textContent="Please enter the PIN.";return}
 const b=document.getElementById("loginBtn");b.disabled=true;b.textContent="Checking...";
 try{
  const r=await fetch("/api/admin?action=unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin})});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error("Server returned non-JSON")}
  if(!r.ok)throw new Error(d.message||d.error||"Login failed");
  sessionStorage.setItem("smkAdminToken",d.token);
  location.href="/admin-dashboard.html";
 }catch(e){document.getElementById("loginError").textContent="✕ "+e.message}
 finally{b.disabled=false;b.textContent="Enter Dashboard"}
}
document.getElementById("loginBtn").addEventListener("click",login);
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>

<script>
(function(){
  let deferredPrompt=null;
  const installButton=document.getElementById("pwaInstallButton");
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("/sw.js").catch(function(err){
        console.warn("PWA service worker registration failed:",err);
      });
    });
  }
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    deferredPrompt=event;
    if(installButton){installButton.hidden=false}
  });
  if(installButton){
    installButton.addEventListener("click",async function(){
      if(!deferredPrompt)return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
      installButton.hidden=true;
    });
  }
  window.addEventListener("appinstalled",function(){
    if(installButton)installButton.hidden=true;
  });
})();
</script>

</body></html>
