<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f334a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SMKDHAB Sports">
<link rel="apple-touch-icon" href="/assets/pwa-icon-192.svg">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Access | SMK Datuk Haji Ahmad Badawi</title>
<link rel="stylesheet" href="/style.css"></head>
<body><button id="pwaInstallButton" class="pwa-install-button" type="button" hidden>＋ Install App</button><div class="motion-field" aria-hidden="true"><span class="lane"></span><span class="lane"></span><span class="lane"></span></div>
<section id="login" class="login">
<div class="login-card">
<a class="button-secondary" href="/" style="width:100%;margin-bottom:14px">← Back to Main Dashboard</a>
<img class="login-logo" src="/assets/smkdhbadawi-logo.jpg" alt="SMK Datuk Haji Ahmad Badawi crest">
<span class="eyebrow">SMKDHAB ADMINISTRATION</span>
<h1>Admin Access</h1><p>Secure administrator dashboard.</p>
<div class="field"><label>ADMINISTRATOR PIN</label><input id="pin" type="password" placeholder="Enter PIN" autocomplete="current-password"></div>
<button class="button-primary login-button" id="loginBtn" type="button">Enter Dashboard</button>
<div id="loginError" class="login-error"></div>
<div style="margin-top:9px;font-size:8px;color:var(--muted)">Press Enter to continue.</div>
</div>
</section>
<script>
async function login(){
 const pin=document.getElementById("pin").value.trim();
 if(!pin){document.getElementById("loginError").textContent="Please enter the PIN.";return}
 const b=document.getElementById("loginBtn");b.disabled=true;b.textContent="Checking...";
 try{
  const r=await fetch("/api/admin?action=unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin})});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw new Error("Server returned non-JSON")}
  if(!r.ok)throw new Error(d.message||d.error||"Login failed");
  sessionStorage.setItem("smkAdminToken",d.token);
  location.href="/admin-dashboard.html";
 }catch(e){document.getElementById("loginError").textContent="✕ "+e.message}
 finally{b.disabled=false;b.textContent="Enter Dashboard"}
}
document.getElementById("loginBtn").addEventListener("click",login);
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>

<script>
(function(){
  let deferredPrompt=null;
  const installButton=document.getElementById("pwaInstallButton");
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("/sw.js").catch(function(err){
        console.warn("PWA service worker registration failed:",err);
      });
    });
  }
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    deferredPrompt=event;
    if(installButton){installButton.hidden=false}
  });
  if(installButton){
    installButton.addEventListener("click",async function(){
      if(!deferredPrompt)return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
      installButton.hidden=true;
    });
  }
  window.addEventListener("appinstalled",function(){
    if(installButton)installButton.hidden=true;
  });
})();
</script>

</body></html>
