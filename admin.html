<!doctype html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin View</title><link rel="stylesheet" href="/style.css"></head><body><div id="lock" class="lock"><div class="pin"><div>🔐</div><small>ADMIN ACCESS</small><h1>Masukkan PIN</h1><input id="pin" type="password" maxlength="6" placeholder="••••••"><button onclick="unlock()">Unlock Dashboard</button><p id="err"></p><a href="/">← Kembali</a></div></div><div id="app" class="hidden"><header><a href="/">🏃 SukanSekolah</a><span>🛡️ Admin View　<a href="/teacher.html">Teacher View →</a></span></header><main><small>ANTARAMUKA ADMIN</small><h1>Dashboard Sukan</h1><div class="stats"><div><small>Total Peserta</small><b id="total">0</b></div><div><small>Acara Berdaftar</small><b id="events">0</b></div><div><small>Rumah Sukan</small><b>4</b></div></div><section class="card"><h2>📋 Master Data</h2><input id="q" placeholder="🔎 Cari nama, ID, acara..."><div class="table"><table><thead><tr><th>Pelajar</th><th>ID</th><th>Acara</th><th>Kategori</th><th>Rumah</th><th>Guru</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="split"><div class="card"><h2>🏆 Keputusan</h2><select id="participant"></select><div class="grid two"><label>Kedudukan<input id="position" type="number"></label><label>Mata<input id="points" type="number"></label><label>Masa<input id="timing"></label><label>Skor<input id="score" type="number"></label></div><button onclick="save()">Simpan Keputusan</button><span id="rm"></span></div><div class="card"><h2>🥇 Peserta Terbaik</h2><ol id="leaders"></ol></div></section><button onclick="print()">🖨 Cetak</button></main></div><script>let regs=[];async function unlock(){let r=await fetch('/api/admin/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})});if(!r.ok)return err.textContent='PIN salah.';lock.classList.add('hidden');app.classList.remove('hidden');load()}async function load(){let [o,r,l]=await Promise.all([fetch('/api/admin/overview').then(x=>x.json()),fetch('/api/admin/registrations').then(x=>x.json()),fetch('/api/admin/leaderboard').then(x=>x.json())]);regs=r;total.textContent=o.total;events.textContent=o.eventsOngoing;render();participant.innerHTML=regs.map(x=>`<option value="${x._id}">${x.studentName} — ${x.event}</option>`).join('');leaders.innerHTML=l.map(x=>`<li><b>${x.studentName}</b> — ${x.house} · ${x.points} mata</li>`).join('')||'<li>Belum ada keputusan.</li>'}function render(){let z=q.value.toLowerCase();rows.innerHTML=regs.filter(x=>JSON.stringify(x).toLowerCase().includes(z)).map(x=>`<tr><td>${x.studentName}</td><td>${x.studentId}</td><td>${x.event}</td><td>${x.category}</td><td>${x.house}</td><td>${x.teacher||'-'}</td></tr>`).join('')}q.oninput=render;async function save(){let r=await fetch('/api/admin/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({registrationId:participant.value,position:+position.value,points:+points.value||0,timing:timing.value,score:+score.value||0})});rm.textContent=r.ok?'✓ Disimpan':'Gagal';if(r.ok)load()}</script></body></html>
